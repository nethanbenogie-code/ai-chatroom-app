<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatFlow Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0c0c12;
            color: #eeeef3;
        }

        .admin-header {
            background: linear-gradient(135deg, #6C63FF, #4a42c4);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h1 {
            font-size: 24px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            background: white;
            color: #6C63FF;
            font-weight: 500;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px;
        }

        .stat-card {
            background: #14141c;
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-label {
            color: rgba(238,238,243,0.5);
            font-size: 13px;
        }

        .panel {
            padding: 30px;
        }

        .table-container {
            background: #14141c;
            border-radius: 16px;
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        th {
            background: #1a1a24;
            font-weight: 600;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
        }

        .badge-admin {
            background: rgba(108,99,255,0.2);
            color: #6C63FF;
        }

        .action-btn {
            padding: 4px 10px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 11px;
            margin-right: 5px;
        }

        .action-btn.ban {
            background: rgba(230,57,70,0.2);
            color: #E63946;
        }

        .error-msg {
            background: rgba(230,57,70,0.15);
            border: 1px solid rgba(230,57,70,0.3);
            color: #ff8a8f;
            padding: 15px;
            border-radius: 10px;
            margin: 20px;
        }
    </style>
</head>
<body>
    <div class="admin-header">
        <h1>ChatFlow Admin Panel</h1>
        <a href="/" class="btn">← Back to Chat</a>
    </div>

    <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
            <div class="stat-value" id="totalUsers">-</div>
            <div class="stat-label">Total Users</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="totalMessages">-</div>
            <div class="stat-label">Total Messages</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="totalRooms">-</div>
            <div class="stat-label">Total Rooms</div>
        </div>
    </div>

    <div class="panel">
        <h2>Users</h2>
        <div id="usersError" class="error-msg" style="display:none;"></div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Badge</th>
                        <th>Messages</th>
                        <th>Admin</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersList">
                    <tr>
                        <td colspan="6" style="text-align:center;">Loading users...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadStats() {
            try {
                const res = await fetch('/api/admin/stats');
                if (res.ok) {
                    const stats = await res.json();
                    document.getElementById('totalUsers').textContent = stats.total_users || 0;
                    document.getElementById('totalMessages').textContent = stats.total_messages || 0;
                    document.getElementById('totalRooms').textContent = stats.total_rooms || 0;
                }
            } catch(e) {
                console.error('Stats error:', e);
            }
        }

        async function loadUsers() {
            try {
                console.log('Loading users...');
                const res = await fetch('/api/admin/users');
                
                if (!res.ok) {
                    const errorDiv = document.getElementById('usersError');
                    errorDiv.style.display = 'block';
                    errorDiv.textContent = `Error ${res.status}: ${res.statusText}. Make sure you are logged in as admin.`;
                    document.getElementById('usersList').innerHTML = '<tr><td colspan="6" style="text-align:center;">Failed to load users</td></tr>';
                    return;
                }
                
                const users = await res.json();
                console.log('Users loaded:', users);
                
                if (!users || users.length === 0) {
                    document.getElementById('usersList').innerHTML = '<tr><td colspan="6" style="text-align:center;">No users found</td></tr>';
                    return;
                }
                
                const tbody = document.getElementById('usersList');
                tbody.innerHTML = users.map(u => `
                    <tr>
                        <td><strong>${escapeHtml(u.username)}</strong></td>
                        <td>${escapeHtml(u.email || '-')}</td>
                        <td><span class="badge">${u.badge || 'Member'}</span></td>
                        <td>${u.message_count || 0}</td>
                        <td>${u.is_admin ? '<span class="badge badge-admin">Admin</span>' : '-'}</td>
                        <td>
                            ${!u.is_admin ? `<button class="action-btn" onclick="makeAdmin('${u.username}')">Make Admin</button>` : ''}
                            ${!u.is_banned ? `<button class="action-btn ban" onclick="banUser('${u.username}')">Ban</button>` : `<button class="action-btn" onclick="unbanUser('${u.username}')">Unban</button>`}
                        </td>
                    </tr>
                `).join('');
            } catch(e) {
                console.error('Users error:', e);
                document.getElementById('usersList').innerHTML = '<tr><td colspan="6" style="text-align:center;">Error loading users. Check console.</td></tr>';
            }
        }

        async function makeAdmin(username) {
            if (!confirm(`Make ${username} an admin?`)) return;
            try {
                const res = await fetch('/api/admin/set_admin', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, is_admin: true})
                });
                if (res.ok) {
                    alert(`${username} is now an admin!`);
                    loadUsers();
                } else {
                    alert('Failed to make admin');
                }
            } catch(e) {
                alert('Error: ' + e.message);
            }
        }

        async function banUser(username) {
            const reason = prompt('Reason for ban:', 'Violation of rules');
            if (!reason) return;
            try {
                const res = await fetch('/api/admin/ban', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, reason})
                });
                if (res.ok) {
                    alert(`${username} banned`);
                    loadUsers();
                    loadStats();
                } else {
                    alert('Failed to ban user');
                }
            } catch(e) {
                alert('Error: ' + e.message);
            }
        }

        async function unbanUser(username) {
            if (!confirm(`Unban ${username}?`)) return;
            try {
                const res = await fetch('/api/admin/unban', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username})
                });
                if (res.ok) {
                    alert(`${username} unbanned`);
                    loadUsers();
                    loadStats();
                } else {
                    alert('Failed to unban user');
                }
            } catch(e) {
                alert('Error: ' + e.message);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Load data on page load
        loadStats();
        loadUsers();
        // Refresh every 10 seconds
        setInterval(loadStats, 10000);
        setInterval(loadUsers, 10000);
    </script>
</body>
</html>
