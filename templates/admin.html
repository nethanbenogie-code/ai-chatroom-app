<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>ChatFlow Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0c0c12; color: #eeeef3; }

        .admin-header {
            background: linear-gradient(135deg, #6C63FF, #4a42c4);
            padding: 16px 20px;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 12px;
        }
        .admin-header h1 { font-size: 20px; }
        .header-buttons { display: flex; gap: 10px; flex-wrap: wrap; }

        .btn {
            padding: 10px 16px; border-radius: 8px; border: none; cursor: pointer;
            text-decoration: none; font-weight: 500; transition: all 0.2s;
            display: inline-flex; align-items: center; gap: 6px;
            min-height: 44px; font-size: 14px;
            -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        }
        .btn-primary { background: white; color: #6C63FF; }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: white; }

        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px; padding: 20px;
        }
        .stat-card { background: #14141c; border: 1px solid rgba(255,255,255,0.07); border-radius: 16px; padding: 16px; text-align: center; }
        .stat-value { font-size: 28px; font-weight: 700; }
        .stat-label { color: rgba(238,238,243,0.5); font-size: 12px; margin-top: 4px; }

        /* Tabs — scrollable on mobile */
        .tabs {
            display: flex; gap: 4px;
            padding: 0 16px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            overflow-x: auto; -webkit-overflow-scrolling: touch;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            padding: 12px 20px; cursor: pointer; background: none; border: none;
            color: rgba(238,238,243,0.6); font-family: inherit; font-size: 14px; font-weight: 500;
            transition: all 0.2s; border-bottom: 2px solid transparent;
            white-space: nowrap; min-height: 44px;
            -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        }
        .tab:hover { color: white; }
        .tab.active { color: #6C63FF; border-bottom-color: #6C63FF; }

        .panel { display: none; padding: 20px; }
        .panel.active { display: block; }

        .table-container { background: #14141c; border-radius: 16px; overflow-x: auto; margin-top: 16px; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
        th { background: #1a1a24; font-weight: 600; }

        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; }
        .badge-admin { background: rgba(108,99,255,0.2); color: #6C63FF; }
        .badge-banned { background: rgba(230,57,70,0.2); color: #E63946; }

        .action-btn {
            padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer;
            font-size: 12px; font-weight: 500; margin: 2px;
            min-height: 36px; display: inline-flex; align-items: center;
            -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        }
        .action-btn.delete  { background: rgba(230,57,70,0.2);  color: #E63946; }
        .action-btn.promote { background: rgba(108,99,255,0.2); color: #6C63FF; }
        .action-btn.ban     { background: rgba(230,57,70,0.2);  color: #E63946; }
        .action-btn.unban   { background: rgba(67,185,127,0.2); color: #43B97F; }

        .search-bar { margin-bottom: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
        .search-bar input {
            flex: 1; min-width: 0; padding: 10px 14px;
            background: #1a1a24; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; color: white; font-family: inherit;
            font-size: 16px; outline: none;
            -webkit-appearance: none; appearance: none;
        }
        .search-bar input:focus { border-color: #6C63FF; }

        .toast {
            position: fixed; bottom: 20px; right: 16px; left: 16px; max-width: 360px;
            margin: 0 auto;
            background: #43B97F; color: white; padding: 12px 20px;
            border-radius: 10px; z-index: 2000; animation: fadeIn 0.3s ease;
            font-size: 14px;
        }
        @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    </style>
</head>
<body>
    <div class="admin-header">
        <h1>⚙️ Admin Panel</h1>
        <div class="header-buttons">
            <button class="btn btn-outline" onclick="refreshAll()">⟳ Refresh</button>
            <a href="/" class="btn btn-primary">← Chat</a>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><div class="stat-value" id="totalUsers">-</div><div class="stat-label">Total Users</div></div>
        <div class="stat-card"><div class="stat-value" id="totalMessages">-</div><div class="stat-label">Messages</div></div>
        <div class="stat-card"><div class="stat-value" id="totalRooms">-</div><div class="stat-label">Rooms</div></div>
        <div class="stat-card"><div class="stat-value" id="bannedUsers">-</div><div class="stat-label">Banned</div></div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('users', this)">👥 Users</button>
        <button class="tab" onclick="switchTab('rooms', this)">🏠 Rooms</button>
        <button class="tab" onclick="switchTab('bans', this)">🚫 Bans</button>
    </div>

    <div id="usersPanel" class="panel active">
        <div class="search-bar">
            <input type="text" id="userSearch" placeholder="Search users…" oninput="filterUsers()"/>
        </div>
        <div class="table-container">
            <table>
                <thead><tr><th>Username</th><th>Email</th><th>Badge</th><th>Msgs</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="usersList"><tr><td colspan="6">Loading…</td></tr></tbody>
            </table>
        </div>
    </div>

    <div id="roomsPanel" class="panel">
        <div class="table-container">
            <table>
                <thead><tr><th>Room</th><th>Description</th><th>Created By</th><th>Type</th><th>Action</th></tr></thead>
                <tbody id="roomsList"><tr><td colspan="5">Loading…</td></tr></tbody>
            </table>
        </div>
    </div>

    <div id="bansPanel" class="panel">
        <div class="table-container">
            <table>
                <thead><tr><th>Username</th><th>Banned By</th><th>Reason</th><th>Expires</th><th>Action</th></tr></thead>
                <tbody id="bansList"><tr><td colspan="5">Loading…</td></tr></tbody>
            </table>
        </div>
    </div>

<script>
    var currentTab = 'users';

    function switchTab(tab, el) {
        currentTab = tab;
        document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
        el.classList.add('active');
        document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
        document.getElementById(tab + 'Panel').classList.add('active');
        if (tab === 'rooms') loadRooms();
        if (tab === 'bans')  loadBans();
    }

    async function refreshAll() {
        await loadStats();
        await loadUsers();
        if (currentTab === 'rooms') loadRooms();
        if (currentTab === 'bans')  loadBans();
        showToast('Data refreshed');
    }

    async function loadStats() {
        try {
            var res = await fetch('/api/admin/stats');
            if (!res.ok) return;
            var s = await res.json();
            document.getElementById('totalUsers').innerText    = s.total_users    || 0;
            document.getElementById('totalMessages').innerText = s.total_messages || 0;
            document.getElementById('totalRooms').innerText    = s.total_rooms    || 0;
            document.getElementById('bannedUsers').innerText   = s.banned_users   || 0;
        } catch(e) { console.error(e); }
    }

    async function loadUsers() {
        try {
            var res   = await fetch('/api/admin/users');
            if (!res.ok) throw new Error('Failed');
            var users = await res.json();
            window.allUsers = users;
            renderUsers(users);
        } catch(e) {
            document.getElementById('usersList').innerHTML = '<tr><td colspan="6">Error loading users.</td></tr>';
        }
    }

    function renderUsers(users) {
        var tbody = document.getElementById('usersList');
        if (!users.length) { tbody.innerHTML = '<tr><td colspan="6">No users found</td></tr>'; return; }
        tbody.innerHTML = users.map(function(u) {
            return '<tr>'
                + '<td><strong>' + esc(u.username) + '</strong></td>'
                + '<td>' + esc(u.email || '-') + '</td>'
                + '<td><span class="badge">' + esc(u.badge || 'Member') + '</span></td>'
                + '<td>' + (u.message_count || 0) + '</td>'
                + '<td>'
                  + (u.is_admin  ? '<span class="badge badge-admin">Admin</span> '  : '')
                  + (u.is_banned ? '<span class="badge badge-banned">Banned</span>' : '')
                + '</td>'
                + '<td>'
                  + (!u.is_admin  ? '<button class="action-btn promote" onclick="makeAdmin(\'' + esc(u.username) + '\')">Make Admin</button>' : '')
                  + (!u.is_banned ? '<button class="action-btn ban"   onclick="banUser(\''   + esc(u.username) + '\')">Ban</button>'
                                  : '<button class="action-btn unban" onclick="unbanUser(\'' + esc(u.username) + '\')">Unban</button>')
                + '</td>'
                + '</tr>';
        }).join('');
    }

    function filterUsers() {
        var term = document.getElementById('userSearch').value.toLowerCase();
        if (window.allUsers) {
            renderUsers(window.allUsers.filter(function(u) {
                return u.username.toLowerCase().includes(term) || (u.email && u.email.toLowerCase().includes(term));
            }));
        }
    }

    async function makeAdmin(username) {
        if (!confirm('Make ' + username + ' admin?')) return;
        await fetch('/api/admin/set_admin', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username, is_admin:true})});
        showToast(username + ' is now admin'); loadUsers();
    }

    async function banUser(username) {
        var reason = prompt('Reason for ban:', 'Violation');
        if (!reason) return;
        await fetch('/api/admin/ban', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username, reason})});
        showToast(username + ' banned'); loadUsers(); loadStats();
        if (currentTab === 'bans') loadBans();
    }

    async function unbanUser(username) {
        if (!confirm('Unban ' + username + '?')) return;
        await fetch('/api/admin/unban', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username})});
        showToast(username + ' unbanned'); loadUsers(); loadStats();
        if (currentTab === 'bans') loadBans();
    }

    async function loadRooms() {
        try {
            var res   = await fetch('/api/rooms');
            var rooms = await res.json();
            renderRooms(rooms);
        } catch(e) { console.error(e); }
    }

    function renderRooms(rooms) {
        var tbody = document.getElementById('roomsList');
        if (!rooms.length) { tbody.innerHTML = '<tr><td colspan="5">No rooms found</td></tr>'; return; }
        tbody.innerHTML = rooms.map(function(r) {
            return '<tr>'
                + '<td><strong>#' + esc(r.name) + '</strong></td>'
                + '<td>' + esc(r.description || '-') + '</td>'
                + '<td>' + esc(r.created_by  || 'system') + '</td>'
                + '<td>' + (r.is_default ? 'Default' : 'Custom') + '</td>'
                + '<td>' + (!r.is_default ? '<button class="action-btn delete" onclick="deleteRoom(\'' + esc(r.name) + '\')">Delete</button>' : '—') + '</td>'
                + '</tr>';
        }).join('');
    }

    async function deleteRoom(roomName) {
        if (!confirm('Delete room "' + roomName + '" and all its messages?')) return;
        var res  = await fetch('/api/admin/delete_room', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({room_name:roomName})});
        var data = await res.json();
        if (data.ok) { showToast('Room "' + roomName + '" deleted'); loadRooms(); loadStats(); }
        else showToast(data.msg || 'Failed', 'error');
    }

    async function loadBans() {
        try {
            var res  = await fetch('/api/admin/bans');
            if (!res.ok) throw new Error();
            var bans = await res.json();
            renderBans(bans);
        } catch(e) {
            document.getElementById('bansList').innerHTML = '<tr><td colspan="5">No bans found</td></tr>';
        }
    }

    function renderBans(bans) {
        var tbody = document.getElementById('bansList');
        if (!bans.length) { tbody.innerHTML = '<tr><td colspan="5">No bans</td></tr>'; return; }
        tbody.innerHTML = bans.map(function(b) {
            return '<tr>'
                + '<td><strong>' + esc(b.username) + '</strong></td>'
                + '<td>' + esc(b.banned_by || 'System') + '</td>'
                + '<td>' + esc(b.reason    || 'No reason') + '</td>'
                + '<td>' + (b.expires_at ? new Date(b.expires_at).toLocaleDateString() : 'Permanent') + '</td>'
                + '<td><button class="action-btn unban" onclick="unbanUser(\'' + esc(b.username) + '\')">Unban</button></td>'
                + '</tr>';
        }).join('');
    }

    function showToast(msg, type) {
        var t = document.createElement('div');
        t.className   = 'toast';
        t.textContent = msg;
        if (type === 'error') t.style.background = '#E63946';
        document.body.appendChild(t);
        setTimeout(function() { t.remove(); }, 3000);
    }

    function esc(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, function(m) {
            return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
        });
    }

    loadStats(); loadUsers(); loadRooms(); loadBans();
</script>
</body>
</html>
