<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>ChatFlow</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#6C63FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ChatFlow">
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
/* (your existing CSS – keep as is) */
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&family=Space+Grotesk:wght@500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{ --bg:#0c0c12; --surface:#14141c; --surface2:#1a1a24; --surface3:#20202c; --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.12); --accent:#6C63FF; --accent-dim:rgba(108,99,255,0.18); --text:#eeeef3; --muted:rgba(238,238,243,0.4); --online:#43B97F; --danger:#E63946; --warn:#F4A261; --r:14px; }
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text); height:100vh;display:flex;overflow:hidden;}
/* ... keep all your CSS exactly as you have it ... */
/* (I'm omitting the full CSS for brevity, but you can keep yours) */
</style>
</head>
<body>

<!-- Mobile Menu Buttons -->
<button class="mobile-menu-btn" onclick="toggleMobileSidebar()">☰</button>
<button class="mobile-panel-btn" onclick="toggleMobilePanel()">👥</button>

<!-- Sidebar -->
<div id="sidebar">
  <div class="sb-top">
    <div class="app-brand">💬 Chat<span class="dot">Flow</span></div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Search messages..." id="global-search" oninput="onSearch(this.value)" onfocus="openSearch()" />
    </div>
  </div>
  <div class="sb-section">Rooms<span class="sb-add" title="Create room" onclick="openModal('room-modal')">＋</span></div>
  <div id="room-list"></div>
  <div class="sb-section">Direct Messages<span class="sb-add" title="New DM" onclick="openModal('dm-modal')">＋</span></div>
  <div id="dm-list"></div>
  <div class="sb-bottom">
    <div class="me-row">
      <div class="ava" id="my-ava" style="background:var(--accent);color:#fff">?</div>
      <div class="me-info">
        <div class="me-name" id="my-name-sb">{{ username }}</div>
        <div class="me-badge" id="my-badge-sb">Member · ● Online</div>
      </div>
      <button class="icon-btn" title="Profile" onclick="openModal('profile-modal')">⚙</button>
      <button class="icon-btn" title="Logout" onclick="location.href='/api/logout'">⏻</button>
    </div>
  </div>
</div>

<!-- Main chat -->
<div id="main">
  <div id="chat-header">
    <span id="header-hash" style="font-size:18px">💬</span>
    <span class="header-title" id="header-title">General</span>
    <span class="header-desc" id="header-desc"></span>
    <span class="online-pill" id="online-pill">0 online</span>
    <div class="header-actions">
      <button class="icon-btn" title="Search" onclick="toggleSearch()">🔍</button>
      <button class="icon-btn" title="Members" onclick="togglePanel()">👥</button>
    </div>
  </div>

  <div id="search-panel">
    <input type="text" id="search-input" placeholder="Search in this room..." oninput="roomSearch(this.value)" />
    <div id="search-results"></div>
  </div>

  <div id="messages"></div>
  <div id="typing-bar"></div>
  <div id="input-row">
    <textarea id="msg-input" rows="1" placeholder="Message #General... (type /ai for AI help)" maxlength="1000" onkeydown="onKey(event)" oninput="onInputChange(this)"></textarea>
    <button id="send-btn" onclick="sendMsg()"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button>
  </div>
</div>

<!-- Right panel -->
<div id="right-panel">
  <div class="rp-header">Members</div>
  <div class="rp-body" id="member-list"></div>
</div>

<!-- Modals (Profile, Create Room, DM) – same as you have, keep them -->
<div class="overlay" id="profile-modal">...</div>
<div class="overlay" id="room-modal">...</div>
<div class="overlay" id="dm-modal">...</div>

<script>
const ME = "{{ username }}";
const socket = io();
let currentRoom = 'General';
let currentDM = null;
let myColor = '#6C63FF';
let myBadge = 'Member';
let rooms = [];
let onlineUsers = new Set();
let dmList = [];
let typingTimer;
const COLORS = ['#6C63FF','#FF6584','#43B97F','#F4A261','#2A9D8F','#E76F51','#457B9D','#E63946','#9C6ADE','#00BFA5','#FF7043','#5C6BC0'];
const REACTIONS = ['👍','❤️','😂','😮','😢','🔥'];

// Mobile functions
function toggleMobileSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
function toggleMobilePanel() { document.getElementById('right-panel').classList.toggle('open'); }
document.addEventListener('click', function(e) {
  const sidebar = document.getElementById('sidebar');
  const panel = document.getElementById('right-panel');
  const menuBtn = document.querySelector('.mobile-menu-btn');
  const panelBtn = document.querySelector('.mobile-panel-btn');
  if (sidebar.classList.contains('open') && !sidebar.contains(e.target) && !menuBtn.contains(e.target)) sidebar.classList.remove('open');
  if (panel.classList.contains('open') && !panel.contains(e.target) && !panelBtn.contains(e.target)) panel.classList.remove('open');
});

// Socket event handlers
socket.on('connect', () => console.log('Socket connected'));
socket.on('history', (data) => {
  const box = document.getElementById('messages');
  box.innerHTML = '';
  let lastDate = '';
  data.messages.forEach(m => {
    const d = (m.sent_at||'').split('T')[0];
    if (d && d !== lastDate) { appendDateSep(d); lastDate = d; }
    appendMsg(m);
  });
  box.scrollTop = box.scrollHeight;
});
socket.on('new_message', (msg) => { appendMsg(msg); scrollToBottom(); });
socket.on('room_presence', (data) => {
  onlineUsers = new Set(data.users || []);
  document.getElementById('online-pill').innerText = `${data.count} online`;
  const key = data.room.replace(/\s/g,'_');
  const cntEl = document.getElementById(`cnt-${key}`);
  if (cntEl) cntEl.innerText = data.count;
  loadMembers(); // refresh online dots
});
socket.on('room_switched', (data) => { currentRoom = data.room; });
socket.on('new_room', () => loadRooms());
socket.on('reaction_update', (data) => {
  const rxnDiv = document.getElementById(`rxn-${data.message_id}`);
  if (rxnDiv) rxnDiv.innerHTML = renderReactions(data.message_id, data.reactions);
});
socket.on('user_typing', (data) => {
  const bar = document.getElementById('typing-bar');
  bar.innerText = `${data.username} is typing...`;
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => bar.innerText = '', 2000);
});
socket.on('dm_message', (msg) => {
  if (currentDM && (msg.username === currentDM || msg.to === currentDM)) {
    appendMsg(msg, true);
    scrollToBottom();
  }
  const other = msg.username === ME ? msg.to : msg.username;
  if (!dmList.includes(other)) { dmList.push(other); renderDMList(); }
});
socket.on('dm_history', (data) => {
  const box = document.getElementById('messages');
  box.innerHTML = '';
  data.messages.forEach(m => appendMsg(m, true));
  scrollToBottom();
});
socket.on('kicked', (data) => { alert(`You were kicked from ${data.room}: ${data.reason}`); location.reload(); });
socket.on('banned', (data) => { alert(`You have been banned: ${data.reason}`); location.href = '/api/logout'; });

function scrollToBottom() { const box = document.getElementById('messages'); box.scrollTop = box.scrollHeight; }

// Load data
window.addEventListener('load', async () => {
  await loadMe();
  await loadRooms();
  await loadMembers();
  socket.emit('join_room_req', { room: 'General' });
});
async function loadMe() {
  const res = await fetch('/api/me');
  const u = await res.json();
  if (!u.username) return;
  myColor = u.avatar_color;
  myBadge = u.badge;
  setAva('my-ava', ME, myColor);
  setAva('prof-ava', ME, myColor);
  document.getElementById('my-badge-sb').innerText = `${u.badge} · ● Online`;
  document.getElementById('prof-username').innerText = u.username;
  document.getElementById('prof-stats').innerText = `${u.message_count} messages · ${u.badge}`;
  document.getElementById('prof-email').value = u.email;
  document.getElementById('prof-bio').value = u.bio || '';
  document.getElementById('prof-joined').value = u.joined_at ? u.joined_at.split('T')[0] : '';
  buildSwatches(u.avatar_color);
}
async function loadRooms() {
  const res = await fetch('/api/rooms');
  rooms = await res.json();
  renderRooms();
}
async function loadMembers() {
  const res = await fetch('/api/members');
  const members = await res.json();
  const list = document.getElementById('member-list');
  list.innerHTML = members.map(m => `
    <div class="member-row" onclick="startDM('${m.username}')">
      <div class="ava sm" style="background:${m.avatar_color||'#6C63FF'};color:#fff">${initials(m.username)}</div>
      <div class="info">
        <div class="mname">${escapeHtml(m.username)}</div>
        <div class="mbadge">${m.badge} · ${m.message_count} msgs</div>
      </div>
      <div class="online-dot ${onlineUsers.has(m.username)?'on':''}"></div>
    </div>`).join('');
}
function renderRooms() {
  const list = document.getElementById('room-list');
  list.innerHTML = rooms.map(r => `
    <div class="room-item ${r.name===currentRoom&&!currentDM?'active':''}" onclick="switchRoom('${r.name}','${escapeHtml(r.description||'')}')">
      <span class="hash">#</span> ${escapeHtml(r.name)}
      <span class="cnt" id="cnt-${r.name.replace(/\s/g,'_')}">0</span>
    </div>`).join('');
}
function renderDMList() {
  const list = document.getElementById('dm-list');
  list.innerHTML = dmList.map(u => `
    <div class="room-item dm-item ${currentDM===u?'active':''}" onclick="startDM('${u}')">
      <span class="hash">@</span> ${escapeHtml(u)}
    </div>`).join('');
}
function switchRoom(name, desc) {
  currentDM = null;
  currentRoom = name;
  document.getElementById('header-hash').innerText = '#';
  document.getElementById('header-title').innerText = name;
  document.getElementById('header-desc').innerText = desc ? `· ${desc}` : '';
  document.getElementById('msg-input').placeholder = `Message #${name}...`;
  document.getElementById('messages').innerHTML = '';
  renderRooms();
  renderDMList();
  socket.emit('switch_room', { room: name });
}
function startDM(user) {
  if (user === ME) return;
  currentDM = user;
  currentRoom = null;
  document.getElementById('header-hash').innerText = '✉';
  document.getElementById('header-title').innerText = user;
  document.getElementById('header-desc').innerText = '· Direct Message';
  document.getElementById('msg-input').placeholder = `Message ${user}...`;
  document.getElementById('messages').innerHTML = '';
  if (!dmList.includes(user)) { dmList.push(user); renderDMList(); }
  renderRooms();
  renderDMList();
  socket.emit('load_dm', { user });
  closeModal('dm-modal');
}

// Messaging
function sendMsg() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;
  if (text.startsWith('/ai')) {
    const prompt = text.substring(4).trim();
    sendAIMessage(prompt || 'help');
    input.value = '';
    input.style.height = 'auto';
    return;
  }
  if (currentDM) socket.emit('send_dm', { to: currentDM, text });
  else socket.emit('send_message', { text });
  input.value = '';
  input.style.height = 'auto';
}
function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); return; }
  socket.emit('typing');
}
function onInputChange(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// AI Assistant
async function sendAIMessage(prompt) {
  appendAIMessage(prompt, true);
  document.getElementById('typing-bar').innerHTML = '<span style="color:#6C63FF">🤖 AI Assistant is thinking...</span>';
  try {
    const res = await fetch('/api/ai', { method: 'POST', headers: { 'Content-Type':'application/json' }, body: JSON.stringify({ prompt }) });
    const data = await res.json();
    document.getElementById('typing-bar').innerHTML = '';
    if (data.ok) appendAIMessage(data.response, false);
    else appendAIMessage('❌ AI error. Try again.', false);
  } catch(e) { document.getElementById('typing-bar').innerHTML = ''; appendAIMessage('❌ Network error.', false); }
}
function appendAIMessage(text, isUser) {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg-wrap ${isUser ? 'mine' : ''}`;
  if (isUser) {
    div.innerHTML = `<div class="ava" style="background:${myColor};color:#fff">${initials(ME)}</div><div class="msg-main"><div class="msg-header"><span class="msg-user" style="color:${myColor}">${ME}</span><span class="badge ${myBadge}">${myBadge}</span><span class="msg-time">${new Date().toLocaleTimeString()}</span></div><div class="msg-text">🤖 /ai ${escapeHtml(text)}</div></div>`;
  } else {
    div.innerHTML = `<div class="ava" style="background:#6C63FF;color:#fff">🤖</div><div class="msg-main"><div class="msg-header"><span class="msg-user" style="color:#6C63FF">AI Assistant</span><span class="badge">AI</span><span class="msg-time">${new Date().toLocaleTimeString()}</span></div><div class="msg-text ai-response">${formatAIText(escapeHtml(text))}</div></div>`;
  }
  box.appendChild(div);
  scrollToBottom();
}
function formatAIText(t) { return t.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }

// Message rendering
function appendMsg(m, isDM) {
  const box = document.getElementById('messages');
  const isMine = m.username === ME;
  const div = document.createElement('div');
  div.className = `msg-wrap ${isMine?'mine':''}`;
  div.innerHTML = `
    <div class="ava" style="background:${m.avatar_color||m.color||'#6C63FF'};color:#fff">${initials(m.username)}</div>
    <div class="msg-main">
      <div class="msg-header"><span class="msg-user" style="color:${m.avatar_color||m.color||'#6C63FF'}">${escapeHtml(m.username)}</span><span class="badge ${m.badge||'Member'}">${m.badge||'Member'}</span><span class="msg-time">${m.time||''}</span></div>
      <div class="msg-text">${escapeHtml(m.text)}</div>
      <div class="msg-reactions" id="rxn-${m.id}">${renderReactions(m.id, m.reactions||{})}</div>
    </div>
    <div class="msg-actions">${REACTIONS.map(e=>`<button class="rxn-btn" onclick="react(${m.id},'${e}')">${e}</button>`).join('')}</div>
  `;
  box.appendChild(div);
}
function renderReactions(msgId, rxns) {
  return Object.entries(rxns).filter(([,c])=>c>0).map(([e,c])=>`<span class="rxn-badge" onclick="react(${msgId},'${e}')">${e}<span>${c}</span></span>`).join('');
}
function react(msgId, emoji) { socket.emit('react', { message_id: msgId, emoji }); }
function appendDateSep(d) {
  const box = document.getElementById('messages');
  const div = document.createElement('div'); div.className = 'date-sep'; div.innerText = formatDate(d);
  box.appendChild(div);
}
function formatDate(d) { /* ... */ }

// Modals and UI helpers
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
async function saveProfile() { /* ... */ }
async function createRoom() { /* ... */ }
function openDM() { const user = document.getElementById('dm-target').value.trim(); if(user) startDM(user); }
function buildSwatches(sel) { /* ... */ }
function setAva(id, name, color) { const el=document.getElementById(id); if(el){el.style.background=color; el.innerText=initials(name);} }
function initials(name) { return (name||'?').split(/[\s_]/).map(w=>w[0]).join('').toUpperCase().slice(0,2)||'?'; }
function escapeHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toggleSearch() { document.getElementById('search-panel').classList.toggle('open'); }
function openSearch() { /* noop */ }
function onSearch(q) { /* global search */ }
function roomSearch(q) { /* room search */ }
function togglePanel() { const p=document.getElementById('right-panel'); p.style.display = p.style.display==='none'?'':'none'; }
</script>
</body>
</html>
