<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>ChatFlow</title>
<!-- PWA Support -->
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#6C63FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ChatFlow">
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&family=Space+Grotesk:wght@500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0c12;--surface:#14141c;--surface2:#1a1a24;--surface3:#20202c;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --accent:#6C63FF;--accent-dim:rgba(108,99,255,0.18);
  --text:#eeeef3;--muted:rgba(238,238,243,0.4);
  --online:#43B97F;--danger:#E63946;--warn:#F4A261;
  --r:14px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);
     height:100vh;display:flex;overflow:hidden;}

/* Mobile Menu Button */
.mobile-menu-btn {
    display: none;
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 1001;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 10px;
    color: white;
    cursor: pointer;
    font-size: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

.mobile-panel-btn {
    display: none;
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 1001;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 10px;
    color: white;
    cursor: pointer;
    font-size: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

/* ── Sidebar ── */
#sidebar{width:260px;flex-shrink:0;background:var(--surface);
         border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}

.sb-top{padding:16px 16px 12px;border-bottom:1px solid var(--border);}
.app-brand{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;
           letter-spacing:-0.3px;display:flex;align-items:center;gap:8px;}
.app-brand .dot{color:var(--accent);}
.search-wrap{position:relative;margin-top:10px;}
.search-wrap input{width:100%;padding:8px 10px 8px 32px;background:var(--surface2);
  border:1px solid var(--border);border-radius:8px;color:var(--text);
  font-family:inherit;font-size:13px;outline:none;}
.search-wrap input:focus{border-color:var(--accent);}
.search-wrap input::placeholder{color:var(--muted);}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);
             font-size:13px;color:var(--muted);}

.sb-section{padding:10px 16px 4px;font-size:10px;font-weight:600;letter-spacing:0.1em;
            text-transform:uppercase;color:var(--muted);display:flex;
            align-items:center;justify-content:space-between;}
.sb-add{cursor:pointer;color:var(--muted);font-size:18px;line-height:1;
        transition:color 0.15s;}
.sb-add:hover{color:var(--text);}

.room-item{display:flex;align-items:center;gap:8px;padding:8px 16px;
           cursor:pointer;font-size:13px;color:var(--muted);transition:all 0.15s;
           border-left:2px solid transparent;}
.room-item:hover{background:rgba(255,255,255,0.04);color:var(--text);}
.room-item.active{background:var(--accent-dim);color:var(--text);
                  border-left-color:var(--accent);}
.room-item .hash{font-size:15px;opacity:0.6;}
.room-item .cnt{margin-left:auto;font-size:11px;background:var(--surface3);
                border-radius:20px;padding:1px 7px;color:var(--muted);}
.room-item.dm-item .hash{color:var(--online);}

.sb-bottom{margin-top:auto;padding:12px 16px;border-top:1px solid var(--border);}
.me-row{display:flex;align-items:center;gap:10px;}
.me-info{flex:1;min-width:0;}
.me-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.me-badge{font-size:11px;color:var(--muted);}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--muted);
          font-size:16px;padding:4px;border-radius:6px;transition:all 0.15s;flex-shrink:0;}
.icon-btn:hover{background:var(--surface2);color:var(--text);}

/* ── Main ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}

#chat-header{padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);
             display:flex;align-items:center;gap:10px;}
.header-title{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;}
.header-desc{font-size:12px;color:var(--muted);margin-left:4px;}
.online-pill{margin-left:auto;font-size:12px;color:var(--online);
             background:rgba(67,185,127,0.1);border-radius:20px;padding:3px 10px;}
.header-actions{display:flex;gap:4px;}

#messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:2px;}
#messages::-webkit-scrollbar{width:4px;}
#messages::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

.msg-wrap{display:flex;align-items:flex-start;gap:10px;padding:3px 0;
          position:relative;}
.msg-wrap:hover .msg-actions{opacity:1;}
.msg-wrap .ava{flex-shrink:0;margin-top:2px;}
.msg-main{flex:1;min-width:0;}
.msg-header{display:flex;align-items:baseline;gap:8px;margin-bottom:3px;flex-wrap:wrap;}
.msg-user{font-size:13px;font-weight:600;}
.msg-time{font-size:11px;color:var(--muted);}
.badge{font-size:10px;padding:1px 6px;border-radius:20px;font-weight:500;}
.badge.Member{background:rgba(108,99,255,0.15);color:#a9a2ff;}
.badge.Active{background:rgba(244,162,97,0.15);color:#f4a261;}
.badge.Veteran{background:rgba(230,57,70,0.15);color:#ff8a8f;}
.msg-text{font-size:14px;line-height:1.55;word-break:break-word;color:var(--text);}

/* mine */
.msg-wrap.mine{flex-direction:row-reverse;}
.msg-wrap.mine .msg-header{flex-direction:row-reverse;}
.msg-wrap.mine .msg-text{
  background:var(--accent);border-radius:4px 14px 14px 14px;
  padding:8px 12px;display:inline-block;max-width:440px;
}
.msg-wrap.mine .msg-user{display:none;}
.msg-wrap.mine .msg-actions{right:auto;left:-4px;}

/* reactions */
.msg-reactions{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
.rxn-badge{background:var(--surface3);border:1px solid var(--border);
           border-radius:20px;padding:2px 8px;font-size:12px;cursor:pointer;
           transition:background 0.15s;display:flex;align-items:center;gap:3px;}
.rxn-badge:hover{background:var(--surface2);border-color:var(--border2);}
.rxn-badge span{color:var(--muted);font-size:11px;}

.msg-actions{position:absolute;right:-4px;top:-6px;background:var(--surface2);
             border:1px solid var(--border);border-radius:8px;padding:4px;
             display:flex;gap:2px;opacity:0;transition:opacity 0.15s;z-index:10;}
.rxn-btn{background:none;border:none;cursor:pointer;font-size:14px;padding:3px 5px;
         border-radius:5px;transition:background 0.1s;}
.rxn-btn:hover{background:var(--surface3);}

.system-line{text-align:center;font-size:11px;color:var(--muted);
             padding:3px 0;margin:3px 0;}
.date-sep{text-align:center;font-size:11px;color:var(--muted);padding:8px 0;
          display:flex;align-items:center;gap:8px;}
.date-sep::before,.date-sep::after{content:'';flex:1;height:1px;background:var(--border);}

#typing-bar{padding:0 20px 6px;font-size:12px;color:var(--muted);
            font-style:italic;min-height:22px;}

#input-row{padding:12px 20px;background:var(--surface);border-top:1px solid var(--border);
           display:flex;align-items:flex-end;gap:10px;}
#msg-input{flex:1;padding:10px 14px;background:var(--surface2);
           border:1px solid var(--border);border-radius:12px;
           color:var(--text);font-family:inherit;font-size:14px;
           outline:none;resize:none;max-height:120px;line-height:1.45;
           transition:border-color 0.2s;}
#msg-input:focus{border-color:var(--accent);}
#msg-input::placeholder{color:var(--muted);}
#send-btn{width:42px;height:42px;border-radius:10px;background:var(--accent);
          border:none;display:flex;align-items:center;justify-content:center;
          cursor:pointer;flex-shrink:0;transition:opacity 0.2s,transform 0.1s;}
#send-btn:hover{opacity:0.88;}
#send-btn:active{transform:scale(0.92);}
#send-btn svg{width:17px;height:17px;fill:#fff;}

/* ── Right panel ── */
#right-panel{width:240px;flex-shrink:0;background:var(--surface);
             border-left:1px solid var(--border);display:flex;flex-direction:column;
             overflow:hidden;}
.rp-header{padding:14px 16px;border-bottom:1px solid var(--border);
           font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);}
.rp-body{flex:1;overflow-y:auto;padding:8px;}
.rp-body::-webkit-scrollbar{width:3px;}
.rp-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
.member-row{display:flex;align-items:center;gap:8px;padding:6px 8px;
            border-radius:8px;cursor:pointer;transition:background 0.15s;}
.member-row:hover{background:var(--surface2);}
.member-row .info{flex:1;min-width:0;}
.member-row .mname{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.member-row .mbadge{font-size:10px;color:var(--muted);}
.online-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;}
.online-dot.on{background:var(--online);}

/* ── Avatar ── */
.ava{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;
     justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
.ava.sm{width:28px;height:28px;font-size:11px;}
.ava.lg{width:48px;height:48px;font-size:16px;}

/* ── AI Response Styling ── */
.ai-response {
    background: linear-gradient(135deg, rgba(108,99,255,0.1), rgba(108,99,255,0.05));
    border-radius: 12px;
    padding: 12px;
    margin-top: 5px;
}
.ai-response strong {
    color: #6C63FF;
}
.ai-response code {
    background: rgba(0,0,0,0.3);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: monospace;
    font-size: 12px;
}
.ai-response pre {
    background: rgba(0,0,0,0.4);
    padding: 10px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 8px 0;
}
.ai-response pre code {
    background: none;
    padding: 0;
}

/* ── Mobile Responsive ── */
@media (max-width: 768px) {
    .mobile-menu-btn, .mobile-panel-btn {
        display: block;
    }
    
    #sidebar {
        position: fixed;
        left: -280px;
        top: 0;
        bottom: 0;
        z-index: 1000;
        transition: left 0.3s ease;
        width: 280px;
    }
    
    #sidebar.open {
        left: 0;
    }
    
    #right-panel {
        position: fixed;
        right: -280px;
        top: 0;
        bottom: 0;
        z-index: 1000;
        transition: right 0.3s ease;
        width: 280px;
    }
    
    #right-panel.open {
        right: 0;
    }
    
    #main {
        width: 100%;
    }
    
    #chat-header {
        padding-left: 55px;
        padding-right: 55px;
    }
    
    .msg-text {
        font-size: 14px;
    }
    
    .msg-user {
        font-size: 12px;
    }
    
    #input-row {
        padding: 8px 12px;
    }
    
    #msg-input {
        font-size: 14px;
        padding: 8px 12px;
    }
    
    .msg-wrap .ava {
        width: 28px;
        height: 28px;
        font-size: 10px;
    }
    
    .header-desc {
        display: none;
    }
}

/* Desktop styles */
@media (min-width: 769px) {
    .mobile-menu-btn, .mobile-panel-btn {
        display: none;
    }
}

/* ── Modals ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:200;
         display:none;align-items:center;justify-content:center;}
.overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:20px;
       padding:28px;width:400px;max-width:94vw;max-height:90vh;overflow-y:auto;}
.modal h2{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:600;margin-bottom:18px;}
.modal .close{float:right;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;}
.modal .close:hover{color:var(--text);}
.form-field{margin-bottom:14px;}
.form-field label{display:block;font-size:11px;font-weight:600;letter-spacing:0.07em;
                  text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.form-field input,.form-field textarea,.form-field select{
  width:100%;padding:10px 13px;background:var(--surface2);
  border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-family:inherit;font-size:13px;outline:none;}
.form-field textarea{resize:vertical;min-height:70px;}
.form-field input:focus,.form-field textarea:focus{border-color:var(--accent);}
.color-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.color-swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;
              border:2px solid transparent;transition:transform 0.15s;}
.color-swatch.sel{border-color:#fff;transform:scale(1.15);}
.modal-btn{width:100%;padding:11px;background:var(--accent);border:none;border-radius:8px;
           color:#fff;font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;
           cursor:pointer;margin-top:4px;transition:opacity 0.2s;}
.modal-btn:hover{opacity:0.88;}
.modal-btn.sec{background:var(--surface2);color:var(--text);margin-top:8px;}
.alert-sm{padding:8px 12px;border-radius:7px;font-size:12px;margin-bottom:12px;display:none;}
.alert-sm.err{background:rgba(230,57,70,0.12);color:#ff8a8f;border:1px solid rgba(230,57,70,0.25);}
.alert-sm.ok{background:rgba(67,185,127,0.12);color:#5ed9a0;border:1px solid rgba(67,185,127,0.25);}

/* ── Search panel ── */
#search-panel{position:absolute;top:54px;right:20px;width:320px;
              background:var(--surface2);border:1px solid var(--border2);
              border-radius:14px;padding:14px;z-index:100;display:none;
              box-shadow:0 8px 30px rgba(0,0,0,0.4);}
#search-panel.open{display:block;}
#search-input{width:100%;padding:9px 12px;background:var(--surface3);
              border:1px solid var(--border);border-radius:8px;color:var(--text);
              font-family:inherit;font-size:13px;outline:none;margin-bottom:10px;}
#search-input:focus{border-color:var(--accent);}
.search-result{padding:8px 10px;border-radius:8px;cursor:pointer;transition:background 0.15s;}
.search-result:hover{background:var(--surface3);}
.sr-room{font-size:10px;color:var(--accent);margin-bottom:2px;}
.sr-user{font-size:12px;font-weight:500;}
.sr-text{font-size:12px;color:var(--muted);}
.sr-time{font-size:11px;color:var(--muted);}
.no-results{font-size:13px;color:var(--muted);text-align:center;padding:16px 0;}
</style>
</head>
<body>

<!-- Mobile Menu Buttons -->
<button class="mobile-menu-btn" onclick="toggleMobileSidebar()">☰</button>
<button class="mobile-panel-btn" onclick="toggleMobilePanel()">👥</button>

<!-- ── Sidebar ── -->
<div id="sidebar">
  <div class="sb-top">
    <div class="app-brand">💬 Chat<span class="dot">Flow</span></div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Search messages..." id="global-search" oninput="onSearch(this.value)" onfocus="openSearch()" />
    </div>
  </div>

  <div class="sb-section">
    Rooms
    <span class="sb-add" title="Create room" onclick="openModal('room-modal')">＋</span>
  </div>
  <div id="room-list"></div>

  <div class="sb-section">Direct Messages
    <span class="sb-add" title="New DM" onclick="openModal('dm-modal')">＋</span>
  </div>
  <div id="dm-list"></div>

  <div class="sb-bottom">
    <div class="me-row">
      <div class="ava" id="my-ava" style="background:var(--accent);color:#fff">?</div>
      <div class="me-info">
        <div class="me-name" id="my-name-sb">{{ username }}</div>
        <div class="me-badge" id="my-badge-sb">Member · ● Online</div>
      </div>
      <button class="icon-btn" title="Profile" onclick="openModal('profile-modal')">⚙</button>
      <button class="icon-btn" title="Logout" onclick="location.href='/api/logout'">⏻</button>
    </div>
  </div>
</div>

<!-- ── Main chat ── -->
<div id="main">
  <div id="chat-header">
    <span id="header-hash" style="font-size:18px">💬</span>
    <span class="header-title" id="header-title">General</span>
    <span class="header-desc" id="header-desc"></span>
    <span class="online-pill" id="online-pill">0 online</span>
    <div class="header-actions">
      <button class="icon-btn" title="Search" onclick="toggleSearch()">🔍</button>
      <button class="icon-btn" title="Members" onclick="togglePanel()">👥</button>
    </div>
  </div>

  <!-- Search panel -->
  <div id="search-panel">
    <input type="text" id="search-input" placeholder="Search in this room..." oninput="roomSearch(this.value)" />
    <div id="search-results"></div>
  </div>

  <div id="messages"></div>
  <div id="typing-bar"></div>
  <div id="input-row">
    <textarea id="msg-input" rows="1" placeholder="Message #General... (type /ai for AI help)" maxlength="1000"
      onkeydown="onKey(event)" oninput="onInputChange(this)"></textarea>
    <button id="send-btn" onclick="sendMsg()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<!-- ── Right panel: members ── -->
<div id="right-panel">
  <div class="rp-header">Members</div>
  <div class="rp-body" id="member-list"></div>
</div>

<!-- ── Modals (same as before) ── -->

<!-- Profile -->
<div class="overlay" id="profile-modal">
  <div class="modal">
    <span class="close" onclick="closeModal('profile-modal')">✕</span>
    <h2>Your Profile</h2>
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:20px;">
      <div class="ava lg" id="prof-ava" style="background:var(--accent);color:#fff">?</div>
      <div>
        <div style="font-size:16px;font-weight:600;" id="prof-username">–</div>
        <div style="font-size:12px;color:var(--muted);" id="prof-stats">0 messages · Member</div>
      </div>
    </div>
    <div class="alert-sm" id="prof-alert"></div>
    <div class="form-field">
      <label>Bio</label>
      <textarea id="prof-bio" placeholder="Say something about yourself..."></textarea>
    </div>
    <div class="form-field">
      <label>Avatar Color</label>
      <div class="color-row" id="color-swatches"></div>
    </div>
    <div class="form-field">
      <label>Email</label>
      <input type="text" id="prof-email" disabled style="opacity:0.5;cursor:not-allowed"/>
    </div>
    <div class="form-field">
      <label>Member since</label>
      <input type="text" id="prof-joined" disabled style="opacity:0.5;cursor:not-allowed"/>
    </div>
    <button class="modal-btn" onclick="saveProfile()">Save Changes</button>
  </div>
</div>

<!-- Create Room -->
<div class="overlay" id="room-modal">
  <div class="modal">
    <span class="close" onclick="closeModal('room-modal')">✕</span>
    <h2>Create a Room</h2>
    <div class="alert-sm" id="room-alert"></div>
    <div class="form-field">
      <label>Room Name</label>
      <input type="text" id="new-room-name" placeholder="e.g. Gaming, Photography..." maxlength="30"/>
    </div>
    <div class="form-field">
      <label>Description</label>
      <input type="text" id="new-room-desc" placeholder="What's this room about?" maxlength="80"/>
    </div>
    <button class="modal-btn" onclick="createRoom()">Create Room</button>
  </div>
</div>

<!-- DM -->
<div class="overlay" id="dm-modal">
  <div class="modal">
    <span class="close" onclick="closeModal('dm-modal')">✕</span>
    <h2>Direct Message</h2>
    <div class="alert-sm" id="dm-alert"></div>
    <div class="form-field">
      <label>Username</label>
      <input type="text" id="dm-target" placeholder="Enter username..." maxlength="20"/>
    </div>
    <button class="modal-btn" onclick="openDM()">Open DM</button>
  </div>
</div>

<script>
const ME = "{{ username }}";
const socket = io();
let currentRoom = 'General';
let currentDM = null;
let myColor = '#6C63FF';
let myBadge = 'Member';
let rooms = [];
let onlineUsers = new Set();
let dmList = [];
let typingTimer;
const COLORS = ['#6C63FF','#FF6584','#43B97F','#F4A261','#2A9D8F','#E76F51','#457B9D','#E63946','#9C6ADE','#00BFA5','#FF7043','#5C6BC0'];
const REACTIONS = ['👍','❤️','😂','😮','😢','🔥'];

// Mobile Functions
function toggleMobileSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
}

function toggleMobilePanel() {
    document.getElementById('right-panel').classList.toggle('open');
}

// Close mobile panels when clicking outside
document.addEventListener('click', function(e) {
    const sidebar = document.getElementById('sidebar');
    const panel = document.getElementById('right-panel');
    const menuBtn = document.querySelector('.mobile-menu-btn');
    const panelBtn = document.querySelector('.mobile-panel-btn');
    
    if (sidebar.classList.contains('open') && !sidebar.contains(e.target) && !menuBtn.contains(e.target)) {
        sidebar.classList.remove('open');
    }
    if (panel.classList.contains('open') && !panel.contains(e.target) && !panelBtn.contains(e.target)) {
        panel.classList.remove('open');
    }
});

// ── Init ──────────────────────────────────────────────
window.addEventListener('load', async () => {
  await loadMe();
  await loadRooms();
  await loadMembers();
  socket.emit('join_room_req', { room: 'General' });
  registerServiceWorker();
});

// Register Service Worker for PWA
function registerServiceWorker() {
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/sw.js')
            .then(reg => console.log('Service Worker registered', reg))
            .catch(err => console.log('Service Worker failed', err));
    }
}

async function loadMe() {
  const res = await fetch('/api/me');
  const u = await res.json();
  if (!u.username) return;
  myColor = u.avatar_color;
  myBadge = u.badge;
  setAva('my-ava', ME, myColor);
  setAva('prof-ava', ME, myColor);
  document.getElementById('my-badge-sb').textContent = `${u.badge} · ● Online`;
  document.getElementById('prof-username').textContent = u.username;
  document.getElementById('prof-stats').textContent = `${u.message_count} messages · ${u.badge}`;
  document.getElementById('prof-email').value = u.email;
  document.getElementById('prof-bio').value = u.bio || '';
  document.getElementById('prof-joined').value = u.joined_at ? u.joined_at.split('T')[0] : '';
  buildSwatches(u.avatar_color);
}

async function loadRooms() {
  const res = await fetch('/api/rooms');
  rooms = await res.json();
  renderRooms();
}
