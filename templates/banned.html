<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Banned - ChatFlow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0c0c12 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #eeeef3;
        }
        .ban-card {
            background: rgba(20, 20, 28, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 48px;
            max-width: 500px;
            text-align: center;
            border: 1px solid rgba(230, 57, 70, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        .ban-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #E63946;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: rgba(238, 238, 243, 0.7);
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            padding: 12px 28px;
            background: #6C63FF;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.2s;
            margin-top: 12px;
        }
        .btn:hover {
            background: #5a54d8;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="ban-card">
        <div class="ban-icon">🚫</div>
        <h1>Account Banned</h1>
        <p>Your account has been suspended by an administrator.</p>
        <a href="/api/logout" class="btn">Return to Login</a>
    </div>
</body>
</html>
