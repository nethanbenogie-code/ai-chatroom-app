<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - ChatFlow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:'Segoe UI', Roboto, sans-serif;
    background:linear-gradient(135deg, #0c0c12 0%, #1a1a2e 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#eeeef3;
}
.card{
    background:rgba(20,20,28,0.95);
    border-radius:24px;
    padding:40px;
    width:400px;
    border:1px solid rgba(255,255,255,0.08);
}
.logo{
    width:52px;height:52px;border-radius:14px;background:#6C63FF;
    display:flex;align-items:center;justify-content:center;font-size:26px;
    margin:0 auto 20px;
}
h1{font-size:24px;font-weight:700;text-align:center;margin-bottom:8px;}
.subtitle{text-align:center;color:rgba(238,238,243,0.6);font-size:14px;margin-bottom:28px;}
.field{margin-bottom:20px;}
label{font-size:12px;font-weight:600;text-transform:uppercase;color:rgba(238,238,243,0.6);
      display:block;margin-bottom:6px;}
input{width:100%;padding:12px 14px;background:#1e1e28;border:1px solid rgba(255,255,255,0.08);
      border-radius:10px;color:#eeeef3;font-family:inherit;font-size:14px;outline:none;}
input:focus{border-color:#6C63FF;}
.btn{width:100%;padding:13px;background:#6C63FF;border:none;border-radius:10px;
     color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;}
.btn:hover{opacity:0.88;}
.alert{padding:12px;border-radius:10px;font-size:13px;margin-bottom:20px;display:none;}
.alert.error{background:rgba(230,57,70,0.15);border:1px solid rgba(230,57,70,0.3);color:#ff8a8f;}
.alert.success{background:rgba(67,185,127,0.15);border:1px solid rgba(67,185,127,0.3);color:#5ed9a0;}
.back-link{text-align:center;margin-top:20px;}
.back-link a{color:#6C63FF;text-decoration:none;font-size:14px;}
</style>
</head>
<body>
<div class="card">
    <div class="logo">🔐</div>
    <h1>Reset Password</h1>
    <p class="subtitle">Create a new password for your account</p>

    <div id="alert" class="alert"></div>

    <div class="field">
        <label>New Password</label>
        <input type="password" id="new-password" placeholder="Min. 6 characters">
    </div>

    <div class="field">
        <label>Confirm Password</label>
        <input type="password" id="confirm-password" placeholder="Re-enter your password">
    </div>

    <button class="btn" onclick="resetPassword()">Reset Password</button>
    
    <div class="back-link">
        <a href="/auth">← Back to Login</a>
    </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');

function showAlert(msg, type) {
    var el = document.getElementById('alert');
    el.textContent = msg;
    el.className = 'alert ' + type;
    el.style.display = 'block';
    setTimeout(function() {
        el.style.display = 'none';
    }, 5000);
}

async function resetPassword() {
    var newPassword = document.getElementById('new-password').value;
    var confirmPassword = document.getElementById('confirm-password').value;
    var btn = event.target;
    
    if (!newPassword || !confirmPassword) {
        showAlert('Please fill in both fields', 'error');
        return;
    }
    
    if (newPassword.length < 6) {
        showAlert('Password must be at least 6 characters', 'error');
        return;
    }
    
    if (newPassword !== confirmPassword) {
        showAlert('Passwords do not match', 'error');
        return;
    }
    
    if (!token) {
        showAlert('Invalid reset link. Please request a new one.', 'error');
        return;
    }
    
    btn.disabled = true;
    btn.textContent = 'Resetting...';
    
    try {
        var res = await fetch('/api/reset-password', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                token: token,
                new_password: newPassword,
                confirm_password: confirmPassword
            })
        });
        var data = await res.json();
        
        if (data.ok) {
            showAlert(data.msg, 'success');
            setTimeout(function() {
                window.location.href = '/auth';
            }, 2000);
        } else {
            showAlert(data.msg, 'error');
            btn.disabled = false;
            btn.textContent = 'Reset Password';
        }
    } catch(e) {
        showAlert('Network error. Please try again.', 'error');
        btn.disabled = false;
        btn.textContent = 'Reset Password';
    }
}
</script>
</body>
</html>
