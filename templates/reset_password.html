<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Reset Password - ChatFlow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Segoe UI',Roboto,sans-serif;
  background:linear-gradient(135deg,#0c0c12 0%,#1a1a2e 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  color:#eeeef3;padding:16px;
}
.card{
  background:rgba(20,20,28,0.95);border-radius:24px;
  padding:40px 32px;width:100%;max-width:400px;
  border:1px solid rgba(255,255,255,0.08);
}
.logo{
  width:52px;height:52px;border-radius:14px;background:#6C63FF;
  display:flex;align-items:center;justify-content:center;font-size:26px;
  margin:0 auto 20px;
}
h1{font-size:24px;font-weight:700;text-align:center;margin-bottom:8px;}
.subtitle{text-align:center;color:rgba(238,238,243,0.6);font-size:14px;margin-bottom:28px;}
.field{margin-bottom:20px;}
label{font-size:12px;font-weight:600;text-transform:uppercase;
      color:rgba(238,238,243,0.6);display:block;margin-bottom:6px;}
.pw-wrap{position:relative;}
input{
  width:100%;padding:13px 14px;background:#1e1e28;
  border:1px solid rgba(255,255,255,0.08);border-radius:10px;
  color:#eeeef3;font-family:inherit;font-size:16px;outline:none;
  -webkit-appearance:none;appearance:none;
}
input:focus{border-color:#6C63FF;}
.pw-toggle{
  position:absolute;right:0;top:0;bottom:0;
  display:flex;align-items:center;padding:0 14px;
  cursor:pointer;color:rgba(238,238,243,0.45);font-size:13px;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.btn{
  width:100%;padding:14px;background:#6C63FF;border:none;border-radius:10px;
  color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;
  min-height:48px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.btn:active{opacity:0.85;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.alert{padding:12px;border-radius:10px;font-size:13px;margin-bottom:20px;display:none;}
.alert.error{background:rgba(230,57,70,0.15);border:1px solid rgba(230,57,70,0.3);color:#ff8a8f;}
.alert.success{background:rgba(67,185,127,0.15);border:1px solid rgba(67,185,127,0.3);color:#5ed9a0;}
.back-link{text-align:center;margin-top:20px;}
.back-link a{
  color:#6C63FF;text-decoration:none;font-size:14px;
  display:inline-block;padding:6px 0;
  -webkit-tap-highlight-color:transparent;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🔐</div>
  <h1>Reset Password</h1>
  <p class="subtitle">Create a new password for your account</p>
  <div id="alert" class="alert"></div>
  <div class="field">
    <label>New Password</label>
    <div class="pw-wrap">
      <input type="password" id="new-password" placeholder="Min. 6 characters"
             autocomplete="new-password"/>
      <span class="pw-toggle" onclick="togglePw('new-password','tgl-new')" id="tgl-new">Show</span>
    </div>
  </div>
  <div class="field">
    <label>Confirm Password</label>
    <div class="pw-wrap">
      <input type="password" id="confirm-password" placeholder="Re-enter your password"
             autocomplete="new-password"/>
      <span class="pw-toggle" onclick="togglePw('confirm-password','tgl-cf')" id="tgl-cf">Show</span>
    </div>
  </div>
  <button class="btn" id="btn-reset" onclick="doReset(this)">Reset Password</button>
  <div class="back-link"><a href="/auth">← Back to Login</a></div>
</div>
<script>
var token = new URLSearchParams(window.location.search).get('token');

function showAlert(msg, type) {
  var el = document.getElementById('alert');
  el.textContent = msg;
  el.className = 'alert ' + type;
  el.style.display = 'block';
  setTimeout(function() { el.style.display = 'none'; }, 5000);
}

function togglePw(inputId, toggleId) {
  var input  = document.getElementById(inputId);
  var toggle = document.getElementById(toggleId);
  var isHidden = input.type === 'password';
  input.type = isHidden ? 'text' : 'password';
  toggle.textContent = isHidden ? 'Hide' : 'Show';
}

async function doReset(btn) {
  var newPassword     = document.getElementById('new-password').value;
  var confirmPassword = document.getElementById('confirm-password').value;
  if (!newPassword || !confirmPassword) { showAlert('Please fill in both fields', 'error'); return; }
  if (newPassword.length < 6)           { showAlert('Password must be at least 6 characters', 'error'); return; }
  if (newPassword !== confirmPassword)  { showAlert('Passwords do not match', 'error'); return; }
  if (!token) { showAlert('Invalid reset link. Please request a new one.', 'error'); return; }
  btn.disabled = true; btn.textContent = 'Resetting…';
  try {
    var res  = await fetch('/api/reset-password', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({token, new_password: newPassword, confirm_password: confirmPassword})
    });
    var data = await res.json();
    if (data.ok) {
      showAlert(data.msg, 'success');
      setTimeout(function() { window.location.href = '/auth'; }, 2000);
    } else {
      showAlert(data.msg, 'error');
      btn.disabled = false; btn.textContent = 'Reset Password';
    }
  } catch(e) {
    showAlert('Network error. Please try again.', 'error');
    btn.disabled = false; btn.textContent = 'Reset Password';
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doReset(document.getElementById('btn-reset'));
});
</script>
</body>
</html>
