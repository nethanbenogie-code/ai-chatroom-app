<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatFlow — Sign In</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&family=Space+Grotesk:wght@500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0c12;--surface:#17171f;--surface2:#1e1e28;
  --border:rgba(255,255,255,0.08);--accent:#6C63FF;--accent-dim:rgba(108,99,255,0.15);
  --text:#eeeef3;--muted:rgba(238,238,243,0.45);--success:#43B97F;--danger:#E63946;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background-image:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(108,99,255,0.18),transparent);
}
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:24px;padding:40px 36px;width:420px;
}
.logo{
  width:52px;height:52px;border-radius:14px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:26px;
  margin:0 auto 18px;
}
h1{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;
   text-align:center;letter-spacing:-0.5px;margin-bottom:4px;}
.subtitle{text-align:center;color:var(--muted);font-size:14px;margin-bottom:28px;}

/* Tabs */
.tabs{display:flex;background:var(--surface2);border-radius:12px;padding:4px;margin-bottom:24px;}
.tab{flex:1;padding:9px;text-align:center;font-size:14px;font-weight:500;
     border-radius:9px;cursor:pointer;color:var(--muted);transition:all 0.2s;}
.tab.active{background:var(--accent);color:#fff;}

/* Form */
.field{margin-bottom:14px;}
label{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0.04em;
      text-transform:uppercase;display:block;margin-bottom:6px;}
input{width:100%;padding:12px 14px;background:var(--surface2);
      border:1px solid var(--border);border-radius:10px;
      color:var(--text);font-family:inherit;font-size:14px;
      outline:none;transition:border-color 0.2s;}
input:focus{border-color:var(--accent);}
input::placeholder{color:var(--muted);}

.btn{width:100%;padding:13px;background:var(--accent);border:none;border-radius:10px;
     color:#fff;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;
     cursor:pointer;margin-top:6px;transition:opacity 0.2s,transform 0.1s;letter-spacing:0.02em;}
.btn:hover{opacity:0.88;}
.btn:active{transform:scale(0.98);}
.btn:disabled{opacity:0.5;cursor:not-allowed;}

.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none;}
.alert.error{background:rgba(230,57,70,0.12);border:1px solid rgba(230,57,70,0.3);color:#ff8a8f;}
.alert.success{background:rgba(67,185,127,0.12);border:1px solid rgba(67,185,127,0.3);color:#5ed9a0;}

.pw-wrap{position:relative;}
.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);
           cursor:pointer;color:var(--muted);font-size:13px;user-select:none;}

.strength{height:3px;border-radius:3px;margin-top:6px;background:var(--border);overflow:hidden;}
.strength-bar{height:100%;border-radius:3px;transition:width 0.3s,background 0.3s;}

.terms{font-size:12px;color:var(--muted);text-align:center;margin-top:12px;}

.form-container {
    display: block;
}

.form-container.hidden {
    display: none;
}

.forgot-link {
    text-align: right;
    margin-top: -8px;
    margin-bottom: 15px;
}

.forgot-link a {
    color: var(--accent);
    font-size: 12px;
    text-decoration: none;
    transition: opacity 0.2s;
}

.forgot-link a:hover {
    text-decoration: underline;
    opacity: 0.8;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">💬</div>
  <h1>ChatFlow</h1>
  <p class="subtitle">Real-time messaging for everyone</p>

  <div class="tabs">
    <div class="tab active" onclick="showTab('signup')">Sign Up</div>
    <div class="tab" onclick="showTab('login')">Log In</div>
  </div>

  <div id="alert-box" class="alert"></div>

  <!-- SIGNUP FORM -->
  <div id="form-signup" class="form-container">
    <div class="field">
      <label>Username</label>
      <input type="text" id="su-username" placeholder="e.g. cool_dev" maxlength="20"/>
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="su-email" placeholder="you@example.com"/>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="pw-wrap">
        <input type="password" id="su-password" placeholder="Min. 6 characters" oninput="checkStrength(this)"/>
        <span class="pw-toggle" onclick="togglePw('su-password',this)">Show</span>
      </div>
      <div class="strength"><div class="strength-bar" id="str-bar" style="width:0%"></div></div>
    </div>
    <div class="field">
      <label>Confirm Password</label>
      <div class="pw-wrap">
        <input type="password" id="su-confirm" placeholder="Repeat password"/>
        <span class="pw-toggle" onclick="togglePw('su-confirm',this)">Show</span>
      </div>
    </div>
    <button class="btn" onclick="doSignup()">Create Account</button>
    <p class="terms">By signing up you agree to our Terms of Service</p>
  </div>

  <!-- LOGIN FORM -->
  <div id="form-login" class="form-container hidden">
    <div class="field">
      <label>Username or Email</label>
      <input type="text" id="li-identifier" placeholder="Enter your username or email"/>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="pw-wrap">
        <input type="password" id="li-password" placeholder="Enter your password"/>
        <span class="pw-toggle" onclick="togglePw('li-password',this)">Show</span>
      </div>
    </div>
    <!-- Forgot password link -->
    <div class="forgot-link">
      <a href="/forgot-password">Forgot password or username?</a>
    </div>
    <button class="btn" onclick="doLogin()">Log In</button>
  </div>
</div>

<script>
// Make sure forms are visible
document.addEventListener('DOMContentLoaded', function() {
    console.log("Page loaded");
    // Show signup by default
    showTab('signup');
});

function showTab(tab) {
    console.log("Showing tab:", tab);
    
    var signupForm = document.getElementById('form-signup');
    var loginForm = document.getElementById('form-login');
    var tabs = document.querySelectorAll('.tab');
    
    if (tab === 'signup') {
        signupForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        tabs[0].classList.add('active');
        tabs[1].classList.remove('active');
    } else {
        signupForm.classList.add('hidden');
        loginForm.classList.remove('hidden');
        tabs[0].classList.remove('active');
        tabs[1].classList.add('active');
    }
    
    hideAlert();
}

function showAlert(msg, type) {
    var el = document.getElementById('alert-box');
    el.textContent = msg;
    el.className = 'alert ' + (type || 'error');
    el.style.display = 'block';
    
    // Auto hide after 5 seconds
    setTimeout(function() {
        el.style.display = 'none';
    }, 5000);
}

function hideAlert() {
    var el = document.getElementById('alert-box');
    el.style.display = 'none';
}

function togglePw(inputId, btn) {
    var input = document.getElementById(inputId);
    if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = 'Hide';
    } else {
        input.type = 'password';
        btn.textContent = 'Show';
    }
}

function checkStrength(input) {
    var v = input.value;
    var score = 0;
    if (v.length >= 6) score++;
    if (v.length >= 10) score++;
    if (/[A-Z]/.test(v)) score++;
    if (/[0-9]/.test(v)) score++;
    if (/[^a-zA-Z0-9]/.test(v)) score++;
    
    var bar = document.getElementById('str-bar');
    var colors = ['', '#E63946', '#F4A261', '#43B97F', '#43B97F', '#43B97F'];
    bar.style.width = (score * 20) + '%';
    bar.style.background = colors[score] || '#6C63FF';
}

async function doSignup() {
    var btn = event.target;
    var username = document.getElementById('su-username').value.trim();
    var email = document.getElementById('su-email').value.trim();
    var password = document.getElementById('su-password').value;
    var confirm = document.getElementById('su-confirm').value;
    
    hideAlert();
    
    if (!username || !email || !password) {
        showAlert('All fields are required');
        return;
    }
    
    if (password !== confirm) {
        showAlert('Passwords do not match');
        return;
    }
    
    if (password.length < 6) {
        showAlert('Password must be at least 6 characters');
        return;
    }
    
    btn.disabled = true;
    btn.textContent = 'Creating account...';
    
    try {
        var response = await fetch('/api/signup', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                username: username,
                email: email,
                password: password
            })
        });
        
        var data = await response.json();
        
        if (data.ok) {
            showAlert('Account created! Redirecting...', 'success');
            setTimeout(function() {
                window.location.href = '/';
            }, 1000);
        } else {
            showAlert(data.msg || 'Signup failed');
            btn.disabled = false;
            btn.textContent = 'Create Account';
        }
    } catch (error) {
        console.error('Signup error:', error);
        showAlert('Network error. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Create Account';
    }
}

async function doLogin() {
    var btn = event.target;
    var identifier = document.getElementById('li-identifier').value.trim();
    var password = document.getElementById('li-password').value;
    
    hideAlert();
    
    if (!identifier || !password) {
        showAlert('Please enter your username/email and password');
        return;
    }
    
    btn.disabled = true;
    btn.textContent = 'Logging in...';
    
    try {
        var response = await fetch('/api/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                identifier: identifier,
                password: password
            })
        });
        
        var data = await response.json();
        
        if (data.ok) {
            window.location.href = '/';
        } else {
            showAlert(data.msg || 'Login failed. Check your credentials.');
            btn.disabled = false;
            btn.textContent = 'Log In';
        }
    } catch (error) {
        console.error('Login error:', error);
        showAlert('Network error. Please make sure the server is running.');
        btn.disabled = false;
        btn.textContent = 'Log In';
    }
}

// Enter key support
document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        var loginForm = document.getElementById('form-login');
        if (!loginForm.classList.contains('hidden')) {
            doLogin();
        } else {
            doSignup();
        }
    }
});
</script>
</body>
</html>
